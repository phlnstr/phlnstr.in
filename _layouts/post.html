---
layout: default
---
<article>
  <div class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: "%-d %B %Y" }}</p>
    {%- if page.tags -%}
    <div class="tags">
      {%- for tag in page.tags -%}
      <span class="tag tag-{{ tag }}">{{ tag }}</span>
      {%- endfor -%}
    </div>
    {%- endif -%}
  </div>

  <div class="post-body">
    {{ content }}
  </div>

  <a href="{{ '/' | relative_url }}" class="back-link">← back to field notes</a>
</article>
